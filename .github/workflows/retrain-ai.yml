name: Retrain Model

on:
  push:
    branches: [main]
    paths:
      - 'components/**'
      - 'ai-pipeline.yaml'
      - 'environment/**'

jobs:
  retrain:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check secret exists
        run: |
          if ("${{ secrets.AZURE_CREDENTIALS }}" -eq "") {
            Write-Host "SECRET IS EMPTY"
          } else {
            Write-Host "SECRET EXISTS"
          }

      - name: Azure CLI login
        uses: azure/login@v1.6.1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure Azure ML defaults
        run: |
          echo "Configuring Azure ML defaults..."
          az configure --defaults group=azure-ai workspace=brent-develter-ml location=francecentral

      - name: Create compute if not exists
        run: |
          az ml compute create --file environment/compute.yaml || echo "Compute already exists"

      - name: Run training pipeline
        run: |
          az ml job create --file ai-pipeline.yaml --stream

      - name: Delete compute after training
        if: always()
        run: |
          az ml compute delete --name cli-brent-compute --yes