apiVersion: apps/v1
kind: Deployment
metadata:
  name: sound-api-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sound-api
  template:
    metadata:
      labels:
        app: sound-api
    spec:
      containers:
      - name: api-container
        image: robbeschroyen/sound-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: MODEL_A_PATH
          value: "/app/models/cough-classification-lstm/INPUT_model_path/lstm_model.keras"
        - name: MODEL_B_PATH
          value: "/app/models/cough-classification-cnn/INPUT_model_path/1dcnn_model.keras"
        # FIX: Force TensorFlow's internal loader to run under the Keras 2 engine
        - name: TF_USE_LEGACY_KERAS
          value: "1"
        - name: DB_HOST
          value: "postgres-service"
        - name: DB_USER
          value: "mlops_user"
        - name: DB_PASSWORD
          value: "mlops_password"
        - name: DB_NAME
          value: "sound_classification"
---
apiVersion: v1
kind: Service
metadata:
  name: sound-api-service
spec:
  type: ClusterIP
  selector:
    app: sound-api
  ports:
  - port: 8000
    targetPort: 8000