apiVersion: apps/v1
kind: Deployment
metadata:
  name: sound-api-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sound-api
  template:
    metadata:
      labels:
        app: sound-api
    spec:
      containers:
      - name: api-container
        image: robbeschroyen/sound-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
apiVersion: v1
kind: Service
metadata:
  name: sound-api-service
spec:
  type: ClusterIP
  selector:
    app: sound-api
  ports:
  - port: 8000
    targetPort: 8000